<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vega Web</title>
<style>
  :root { color-scheme: dark; }
  body { font: 15px system-ui, sans-serif; margin: 0; padding: 12px; background: #111; color: #eee; max-width: 900px; margin-inline: auto; }
  input, select, button { font: inherit; padding: 8px; margin: 3px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: #eee; max-width: 100%; }
  input[type=text] { width: 100%; box-sizing: border-box; }
  button { cursor: pointer; } button:hover { background: #333; }
  #status { color: #8ab4f8; min-height: 1.3em; margin: 6px 0; word-break: break-word; }
  #status.err { color: #f28b82; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .card { background: #1c1c1c; border-radius: 8px; overflow: hidden; cursor: pointer; font-size: 12px; }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #333; display: block; }
  .card div { padding: 4px 6px; }
  #detail button { display: block; width: 100%; text-align: left; }
  video { width: 100%; max-height: 60vh; background: #000; margin-top: 8px; }
  h4 { margin: 10px 0 4px; }
</style>
</head>
<body>
<h3>Vega Web demo</h3>
<input type="text" id="worker" placeholder="https://your-worker.workers.dev">
<label><input type="checkbox" id="post"> Worker mein POST support laga diya hai</label><br>
<button id="go">Connect</button>
<button id="loc" title="Termux mini-proxy">Local</button>
<select id="prov" disabled></select>
<select id="cat" disabled></select>
<div id="status"></div>
<video id="v" controls playsinline></video>
<div id="ctl" style="display:none"><select id="qsel"></select> <select id="asel"></select> <select id="ssel"></select> <button id="cp">Link copy</button></div>
<label id="sbwrap" style="display:none"><input type="checkbox" id="sb" checked> Popup/ads block (sandbox)</label>
<iframe id="emb" allowfullscreen allow="autoplay; fullscreen; picture-in-picture" style="display:none;width:100%;aspect-ratio:16/9;border:0;margin-top:8px;background:#000"></iframe>
<div id="detail"></div>
<div id="grid"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
<script type="module">
import { createVega } from "./vega-web.js?v=8";
const $ = (id) => document.getElementById(id);
const GOOD = new Set(["anikoto","animesub","dramacool","durbinLive","gokuHD","internetArchive","kickAssAnime","vega","movies4u","moviezwap","luxMovies","animeworld","kisskhml","animesalt"]);
let vega, hls;
const store = { get: (k, d) => { try { return localStorage.getItem("vw:" + k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem("vw:" + k, v); } catch {} } };
$("worker").value = store.get("worker", "https://twilight-smoke-5ba9.adityaarya93506.workers.dev");
$("post").checked = store.get("post", "0") === "1";

const status = (m, err) => { $("status").textContent = m || ""; $("status").className = err ? "err" : ""; };
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); kids.forEach((k) => e.append(k)); return e; };
const run = async (label, fn) => { status(label + "…"); try { const r = await fn(); status(""); return r; } catch (e) { status(label + " fail: " + (e.message || e), true); console.error(e); } };

$("go").onclick = async () => {
  store.set("worker", $("worker").value.trim()); store.set("post", $("post").checked ? "1" : "0");
  await run("Connecting", async () => {
    vega = await createVega({ worker: $("worker").value.trim(), allowPost: $("post").checked });
    const list = (await vega.providers()).sort((a, b) => GOOD.has(b.value) - GOOD.has(a.value));
    $("prov").replaceChildren(...list.map((p) => el("option", { value: p.value, textContent: (GOOD.has(p.value) ? "✅ " : "") + p.display_name + " (" + p.value + ")" })));
    $("prov").disabled = false; $("cat").disabled = false;
    await loadCats();
  });
};
$("loc").onclick = () => { $("worker").value = "http://127.0.0.1:8787"; $("post").checked = true; status("Local proxy set. Termux mein mini-proxy chalu karke Connect dabao"); };
$("prov").onchange = loadCats;
$("cat").onchange = loadPosts;

async function loadCats() {
  if (hls) { hls.destroy(); hls = null; } const vv = $("v"); vv.pause(); vv.removeAttribute("src"); vv.load(); // clear previous video
  await run("Catalog", async () => {
    const c = await vega.catalog($("prov").value);
    const all = [...c.catalog, ...c.genres];
    $("cat").replaceChildren(...all.map((x) => el("option", { value: x.filter, textContent: x.title })));
  });
  await loadPosts();
}
async function loadPosts() {
  $("grid").replaceChildren(); $("detail").replaceChildren();
  const posts = await run("Posts", () => vega.getPosts($("prov").value, { filter: $("cat").value || "", page: 1 }));
  if (!posts) return;
  if (!posts.length) return status("Koi post nahi mila (provider band ho sakta hai)", true);
  $("grid").replaceChildren(...posts.map((p) => {
    const card = el("div", { className: "card" }, el("img", { src: p.image, loading: "lazy", referrerPolicy: "no-referrer" }), el("div", { textContent: p.title }));
    card.onclick = () => openPost(p); return card;
  }));
}
async function openPost(p) {
  const meta = await run("Meta", () => vega.getMeta($("prov").value, p.link));
  if (!meta) return;
  const d = $("detail"); d.replaceChildren(el("h4", { textContent: meta.title }), el("div", { textContent: (meta.synopsis || "").slice(0, 300) }));
  (meta.linkList || []).forEach((l) => {
    d.append(el("h4", { textContent: l.title + (l.quality ? " · " + l.quality : "") }));
    if (l.episodesLink) d.append(btn("Episodes dikhao", async () => {
      const eps = await run("Episodes", () => vega.getEpisodes($("prov").value, l.episodesLink));
      (eps || []).forEach((e) => d.append(btn(e.title, () => streams(e.link, "series"))));
    }));
    (l.directLinks || []).forEach((x) => d.append(btn(x.title, () => streams(x.link, x.type || meta.type || "movie"))));
  });
  d.scrollIntoView({ behavior: "smooth" });
}
const btn = (t, fn) => { const b = el("button", { textContent: t }); b.onclick = fn; return b; };
async function streams(link, type) {
  const s = await run("Streams", () => vega.getStream($("prov").value, link, type));
  if (!s) return;
  if (!s.length) return status("Is link ke liye koi stream nahi mili", true);
  const d = $("detail"); d.append(el("h4", { textContent: "Servers" }));
  s.forEach((x) => d.append(btn(`${x.server} · ${x.type}${x.quality ? " · " + x.quality : ""}`, () => play(x))));
}
const qsel = $("qsel"), asel = $("asel"), ssel = $("ssel"), emb = $("emb"), ctl = $("ctl");
let lastS = null;
const opt = (v, t) => el("option", { value: String(v), textContent: t });
const showCtl = () => { ctl.style.display = ""; qsel.style.display = qsel.options.length > 2 ? "" : "none"; asel.style.display = asel.options.length > 1 ? "" : "none"; ssel.style.display = ssel.options.length > 1 ? "" : "none"; };
function resetPlayer() {
  if (hls) { hls.destroy(); hls = null; }
  const v = $("v"); v.pause(); v.querySelectorAll("track").forEach((t) => t.remove()); v.removeAttribute("src"); v.load();
  emb.removeAttribute("src"); emb.style.display = "none"; $("sbwrap").style.display = "none"; ctl.style.display = "none";
  [qsel, asel, ssel].forEach((s) => s.replaceChildren());
}
function buildSubUi() {
  const v = $("v"), items = [opt("off", "Subtitles: Off")];
  if (hls) hls.subtitleTracks.forEach((t, i) => items.push(opt("h:" + i, (t.name || "Sub " + (i + 1)) + (t.lang ? " [" + t.lang + "]" : ""))));
  v.querySelectorAll("track[data-ext]").forEach((t, i) => items.push(opt("t:" + i, "* " + (t.label || "Sub " + (i + 1)))));
  const cur = ssel.value; ssel.replaceChildren(...items); if ([...ssel.options].some((o) => o.value === cur)) ssel.value = cur; showCtl();
}
function buildHlsUi() {
  if (!hls) return;
  const lv = hls.levels.map((l, i) => ({ i, h: l.height || 0, b: l.bitrate || 0 })).sort((a, b) => b.h - a.h || b.b - a.b);
  qsel.replaceChildren(opt(-1, "Quality: Auto"), ...lv.map((x) => opt(x.i, x.h ? x.h + "p" : Math.round(x.b / 1000) + " kbps")));
  qsel.value = String(hls.autoLevelEnabled ? -1 : hls.currentLevel);
  asel.replaceChildren(...hls.audioTracks.map((t, i) => opt(i, "Audio: " + (t.name || "Track " + (i + 1)) + (t.lang ? " [" + t.lang + "]" : ""))));
  if (hls.audioTracks.length) asel.value = String(hls.audioTrack);
  buildSubUi();
}
function buildNativeUi() {
  const at = $("v").audioTracks;
  if (at && at.length > 1) asel.replaceChildren(...[...at].map((t, i) => opt(i, "Audio: " + (t.label || t.language || "Track " + (i + 1)))));
  buildSubUi();
}
qsel.onchange = () => { if (hls) hls.currentLevel = +qsel.value; };
asel.onchange = () => { if (hls) hls.audioTrack = +asel.value; else { const at = $("v").audioTracks; if (at) for (let i = 0; i < at.length; i++) at[i].enabled = i === +asel.value; } };
ssel.onchange = () => {
  const v = $("v"), val = ssel.value;
  [...v.textTracks].forEach((t) => (t.mode = "disabled")); if (hls) hls.subtitleTrack = -1;
  if (val === "off") return;
  if (val[0] === "h" && hls) { hls.subtitleDisplay = true; hls.subtitleTrack = +val.slice(2); }
  else if (val[0] === "t") { const t = v.querySelectorAll("track[data-ext]")[+val.slice(2)]; if (t) t.track.mode = "showing"; }
};
$("cp").onclick = () => { if (lastS) navigator.clipboard.writeText(lastS.link).then(() => status("Link copy ho gaya"), () => status(lastS.link)); };
$("sb").onchange = () => { if (lastS && (lastS.type === "embed" || lastS.type === "iframe")) play(lastS); };
const srtToVtt = (t) => "WEBVTT\n\n" + t.replace(/^\uFEFF/, "").replace(/\r\n|\r/g, "\n").replace(/(\d{2}:\d{2}:\d{2}),(\d{3})/g, "$1.$2");
async function addExternalSubs(s) {
  const subs = Array.isArray(s.subtitles) ? s.subtitles : [], v = $("v");
  for (const sub of subs.slice(0, 40)) {
    const u = sub.uri || sub.url || sub.link; if (!u) continue;
    try {
      const r = await fetch(vega.proxyUrl(u, s.headers)); if (!r.ok) continue;
      let t = await r.text(); if (!t.trimStart().startsWith("WEBVTT")) t = srtToVtt(t);
      const tr = el("track", { kind: "subtitles", label: sub.title || sub.language || "Sub", srclang: String(sub.language || "").slice(0, 8), src: URL.createObjectURL(new Blob([t], { type: "text/vtt" })) });
      tr.dataset.ext = "1"; v.append(tr);
    } catch (e) {}
  }
  buildSubUi();
}
function play(s) {
  resetPlayer(); lastS = s; $("cp").style.display = "";
  const v = $("v");
  if (s.type === "torrent" || /^magnet:/i.test(s.link)) return status("Ye torrent link hai, browser mein seedha nahi chalega", true);
  if (s.type === "embed" || s.type === "iframe") {
    $("sbwrap").style.display = ""; ctl.style.display = ""; qsel.style.display = asel.style.display = ssel.style.display = "none"; emb.style.display = "block";
    if ($("sb").checked) emb.setAttribute("sandbox", "allow-scripts allow-same-origin allow-forms allow-presentation"); else emb.removeAttribute("sandbox");
    emb.src = s.link; status("Embed: " + s.server + " (na chale to sandbox ka tick hatao)"); emb.scrollIntoView({ behavior: "smooth" }); return;
  }
  status("Playing: " + s.server + " (" + s.type + ")");
  const isHls = s.type === "m3u8" || s.type === "hls" || /m3u8/i.test(s.link);
  v.onerror = () => status("Video load nahi hua (MKV ya block ho sakta hai). 'Link copy' karke VLC/MX Player mein kholo", true);
  if (isHls && window.Hls && Hls.isSupported()) {
    hls = new Hls({ enableWebVTT: true }); hls.loadSource(s.playUrl); hls.attachMedia(v);
    [Hls.Events.MANIFEST_PARSED, Hls.Events.AUDIO_TRACKS_UPDATED, Hls.Events.SUBTITLE_TRACKS_UPDATED].forEach((e) => hls.on(e, buildHlsUi));
    hls.on(Hls.Events.ERROR, async (_, d) => {
      if (!d.fatal) return; let info = "";
      try { const r = await fetch(s.playUrl); const t = await r.text(); info = " | worker HTTP " + r.status + ": " + t.slice(0, 90).replace(/\s+/g, " "); } catch (e) { info = " | fetch fail: " + e.message; }
      status("HLS " + d.details + (d.response ? " (" + d.response.code + ")" : "") + info, true);
    });
  } else { v.src = s.playUrl; v.addEventListener("loadedmetadata", buildNativeUi, { once: true }); }
  addExternalSubs(s); v.play().catch(() => {}); v.scrollIntoView({ behavior: "smooth" });
}
</script>
</body>
</html>
